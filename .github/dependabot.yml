version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          lint-tooling:
              patterns: ["eslint*", "@typescript-eslint/*", "typescript-eslint", "prettier"]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
